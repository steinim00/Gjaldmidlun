name: Deploy Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Write Visa client certificate
        run: |
          mkdir -p certs
          printf '%s' "${{ secrets.VISA_CLIENT_CERT }}" > certs/visa_cert.pem
          printf '%s' "${{ secrets.VISA_CLIENT_KEY }}" > certs/visa_private_key.pem

      - name: Validate certificate files (diagnostic, no secret content printed)
        run: |
          echo "cert file bytes: $(wc -c < certs/visa_cert.pem)"
          echo "key file bytes: $(wc -c < certs/visa_private_key.pem)"
          grep -q "BEGIN CERTIFICATE" certs/visa_cert.pem && echo "cert header: OK" || echo "cert header: MISSING"
          grep -qE "BEGIN (RSA )?PRIVATE KEY" certs/visa_private_key.pem && echo "key header: OK" || echo "key header: MISSING"
          openssl x509 -in certs/visa_cert.pem -noout -subject -dates || echo "cert failed to parse with openssl"
          openssl pkey -in certs/visa_private_key.pem -noout && echo "key parsed OK with openssl" || echo "key failed to parse with openssl"
          echo "VISA_BASE_URL is set: $([ -n \"${{ secrets.VISA_BASE_URL }}\" ] && echo yes || echo no)"

      - name: Fetch latest FX rates
        run: python scripts/fetch_rates.py
        env:
          VISA_USER_ID: ${{ secrets.VISA_USER_ID }}
          VISA_PASSWORD: ${{ secrets.VISA_PASSWORD }}
          VISA_CLIENT_CERT_PATH: certs/visa_cert.pem
          VISA_CLIENT_KEY_PATH: certs/visa_private_key.pem
          VISA_BASE_URL: ${{ secrets.VISA_BASE_URL }}

      - name: Show fetched rates (diagnostic, no secrets — just currency data)
        run: cat frontend/rates.json

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
