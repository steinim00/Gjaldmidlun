name: Explore Visa public exchange rate calculator (temporary)

on:
  workflow_dispatch: {}

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch the consumer calculator page, look for embedded API calls
        run: |
          curl -s -A "Mozilla/5.0" "https://usa.visa.com/support/consumer/travel-support/exchange-rate-calculator.html" -o /tmp/visa.html -w "HTTP %{http_code}\n"
          echo "--- page size ---"
          wc -c /tmp/visa.html
          echo "--- api/json/fetch/xhr patterns ---"
          grep -o -E "(https?://[a-zA-Z0-9./_?=&%-]*(api|json|rate|convert|fx)[a-zA-Z0-9./_?=&%-]*)" /tmp/visa.html | sort -u | head -40 || true
          echo "--- script src references ---"
          grep -o -E 'src="[^"]*\.js[^"]*"' /tmp/visa.html | sort -u | head -20 || true

      - name: Try plausible underlying endpoints directly
        run: |
          for path in \
            "https://usa.visa.com/cmsapi/fx/rates?fromCurr=ISK&toCurr=USD&amount=1000&direction=send" \
            "https://usa.visa.com/cmsapi/fx/rates?amount=1000&fee=0&utcConvertedDate=&exchangedate=&fromCurr=ISK&toCurr=USD&direction=from" \
            "https://usa.visa.com/dyf/pcp/services/currencyConverterService"; do
            echo "=== $path ==="
            curl -s -A "Mozilla/5.0" -o /tmp/r.json -w "HTTP %{http_code}\n" "$path" || true
            head -c 800 /tmp/r.json
            echo
          done
