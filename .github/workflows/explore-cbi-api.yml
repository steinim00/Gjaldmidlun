name: Explore CBI API (temporary)

on:
  workflow_dispatch: {}

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Try common Swagger spec paths
        run: |
          for path in \
            "https://api.sedlabanki.is/dataportal/swagger/v1/swagger.json" \
            "https://api.sedlabanki.is/dataportal/swagger.json" \
            "https://api.sedlabanki.is/swagger/v1/swagger.json"; do
            echo "=== $path ==="
            curl -s -o /tmp/resp.json -w "HTTP %{http_code}\n" "$path" || true
            head -c 3000 /tmp/resp.json 2>/dev/null
            echo
            echo
          done

      - name: Fetch Swagger UI index for configUrl hint
        run: |
          curl -s "https://api.sedlabanki.is/dataportal/swagger/index.html" | grep -i -E "swagger.json|configUrl|url:" | head -20 || true
