name: Explore CBI API (temporary)

on:
  workflow_dispatch: {}

jobs:
  explore:
    runs-on: ubuntu-latest
    steps:
      - name: Test Frankfurter API - latest rates with ISK as base
        run: |
          echo "=== /v1/latest?base=ISK ==="
          curl -s -w "\nHTTP %{http_code}\n" "https://api.frankfurter.dev/v1/latest?base=ISK&symbols=USD,EUR,GBP,DKK,NOK,SEK,CAD,JPY"

      - name: Test Frankfurter API - ISK as a target symbol (USD base)
        run: |
          echo "=== /v1/latest?base=USD&symbols=ISK ==="
          curl -s -w "\nHTTP %{http_code}\n" "https://api.frankfurter.dev/v1/latest?base=USD&symbols=ISK"

      - name: List currencies
        run: |
          curl -s -w "\nHTTP %{http_code}\n" "https://api.frankfurter.dev/v1/currencies"
